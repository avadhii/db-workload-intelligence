services:
  # ─── Target Database (the DB we monitor) ───────────────────────────
  target-db:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    container_name: target-db
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-targetuser}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-targetpass}
      POSTGRES_DB: ${TARGET_DB_NAME:-targetdb}
    ports:
      - "5433:5432"
    volumes:
      - target-db-data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements,hypopg
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all
      -c track_io_timing=on
      -c log_min_duration_statement=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER:-targetuser} -d ${TARGET_DB_NAME:-targetdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Metrics Store (where we store collected telemetry) ─────────────
  metrics-db:
    image: postgres:16
    container_name: metrics-db
    environment:
      POSTGRES_USER: ${METRICS_DB_USER:-metricsuser}
      POSTGRES_PASSWORD: ${METRICS_DB_PASSWORD:-metricspass}
      POSTGRES_DB: ${METRICS_DB_NAME:-metricsdb}
    ports:
      - "5434:5432"
    volumes:
      - metrics-db-data:/var/lib/postgresql/data
      - ./sql/metrics_schema.sql:/docker-entrypoint-initdb.d/metrics_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METRICS_DB_USER:-metricsuser} -d ${METRICS_DB_NAME:-metricsdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Sandbox DB (ephemeral, created on-demand for what-if tests) ─────
  # Uncomment when needed; typically managed by sandbox_manager.py
  # sandbox-db:
  #   image: postgres:16
  #   container_name: sandbox-db
  #   environment:
  #     POSTGRES_USER: sandboxuser
  #     POSTGRES_PASSWORD: sandboxpass
  #     POSTGRES_DB: sandboxdb
  #   ports:
  #     - "5435:5432"
  #   tmpfs:
  #     - /var/lib/postgresql/data

    # ─── Collector Service ────────────────────────────────────────────────
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: collector
    environment:
      TARGET_DB_DSN: postgresql://${TARGET_DB_USER:-targetuser}:${TARGET_DB_PASSWORD:-targetpass}@target-db:5432/${TARGET_DB_NAME:-targetdb}
      METRICS_DB_DSN: postgresql://${METRICS_DB_USER:-metricsuser}:${METRICS_DB_PASSWORD:-metricspass}@metrics-db:5432/${METRICS_DB_NAME:-metricsdb}
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL:-30}
    depends_on:
      target-db:
        condition: service_healthy
      metrics-db:
        condition: service_healthy
    restart: unless-stopped

  # ─── Load Generator ────────────────────────────────────────────────────
  loadgen:
    build:
      context: .
      dockerfile: loadgen/Dockerfile
    container_name: loadgen
    environment:
      TARGET_DB_DSN: postgresql://${TARGET_DB_USER:-targetuser}:${TARGET_DB_PASSWORD:-targetpass}@target-db:5432/${TARGET_DB_NAME:-targetdb}
      METRICS_DB_DSN: postgresql://${METRICS_DB_USER:-metricsuser}:${METRICS_DB_PASSWORD:-metricspass}@metrics-db:5432/${METRICS_DB_NAME:-metricsdb}
    depends_on:
      target-db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - loadgen

  # ─── FastAPI Backend ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    environment:
      METRICS_DB_DSN: postgresql://${METRICS_DB_USER:-metricsuser}:${METRICS_DB_PASSWORD:-metricspass}@metrics-db:5432/${METRICS_DB_NAME:-metricsdb}
      TARGET_DB_DSN: postgresql://${TARGET_DB_USER:-targetuser}:${TARGET_DB_PASSWORD:-targetpass}@target-db:5432/${TARGET_DB_NAME:-targetdb}
    ports:
      - "8000:8000"
    depends_on:
      metrics-db:
        condition: service_healthy
    restart: unless-stopped

  # ─── Streamlit UI ─────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: ui
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

  # ─── Prometheus ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Postgres Exporter (for Prometheus) ───────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${TARGET_DB_USER:-targetuser}:${TARGET_DB_PASSWORD:-targetpass}@target-db:5432/${TARGET_DB_NAME:-targetdb}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      target-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  target-db-data:
  metrics-db-data:
  grafana-data:
